services:
  omm:
    image: ghcr.io/emfcamp/phones-omm:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CAP_SYS_NICE
    security_opt:
      - seccomp=unconfined
    environment:
      OMM_URL: ${OMM_URL:-}
    volumes:
      - ./data:/opt/SIP-DECT
      - ./conf:/conf
      - ./bin:/firmware:ro
    restart: unless-stopped  
