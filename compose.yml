services:
  omm:
    image: ghcr.io/emfcamp/phones-omm:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CAP_SYS_NICE
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./data:/opt/SIP-DECT
      - ./conf:/conf
      - ./bin/SIP-DECT.bin:/opt/SIP-DECT/SIP-DECT.bin:ro
      - ./bin/iprfp3G.dnld:/opt/SIP-DECT/iprfp3G.dnld:ro
      - ./bin/iprfp4G.dnld:/opt/SIP-DECT/iprfp4G.dnld:ro
    restart: unless-stopped  
